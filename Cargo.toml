[workspace]
members = [
    "crates/hanshi-domain",
    "crates/hanshi-ports",
    "crates/hanshi-core",
    "crates/hanshi-server",
    "crates/hanshi-bin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
authors = ["pleme-io"]
license = "MIT"
repository = "https://github.com/pleme-io/hanshi"
homepage = "https://github.com/pleme-io/hanshi"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[workspace.dependencies]
# core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Typed-dispatcher catalog integration
# (theory/UNIFIED-COMPUTING-MODEL.md §VI).
gen-platform = { git = "https://github.com/pleme-io/gen" }
gen-types = { git = "https://github.com/pleme-io/gen" }

# runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# http
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# config
toml = "0.8"

# domain bundle
sha2 = "0.10"
hex = "0.4"

# blue (crates.io): advisory rule bundles are blue programs
blue-lang-host = "0.0.125"

# hanshi crates (workspace-local)
hanshi-domain = { path = "crates/hanshi-domain" }
hanshi-ports = { path = "crates/hanshi-ports" }
hanshi-core = { path = "crates/hanshi-core" }
hanshi-server = { path = "crates/hanshi-server" }
